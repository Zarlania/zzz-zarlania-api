services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ZARLANIA_CORS_ALLOWED_ORIGINS: "http://localhost:4200,http://localhost:8080"
      ZARLANIA_AUTH_JWT_SIGNING_SECRET: "${ZARLANIA_AUTH_JWT_SIGNING_SECRET:?set ZARLANIA_AUTH_JWT_SIGNING_SECRET in .env}"
